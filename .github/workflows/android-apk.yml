name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK & Accept Licenses
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "Setting up Android SDK environment at $ANDROID_HOME..."
          
          # Ensure licenses directory exists
          mkdir -p "$ANDROID_HOME/licenses"
          
          # Pre-accept all known Android SDK licenses via hashes
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n89388d41e21e77850bee35e386884825017f646f" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo -e "\n79124426920f62e753b07196292e1037313c6183\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$ANDROID_HOME/licenses/intel-android-extra-license"

          # Accept licenses and pre-install target platform if sdkmanager is available
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: Prepare Build Environment
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          
          # Restore debug.keystore from base64 if present, or generate a valid debug keystore
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Clean Project
        run: ./gradlew clean --no-daemon

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Assemble Debug APKs
        run: ./gradlew :app:assembleDebug :phone:assembleDebug --no-daemon --stacktrace

      - name: Verify & Prepare APK Outputs
        run: |
          TABLET_RAW="app/build/outputs/apk/debug/app-debug.apk"
          PHONE_RAW="phone/build/outputs/apk/debug/phone-debug.apk"

          if [ ! -f "$TABLET_RAW" ]; then
            echo "FATAL: Tablet APK file does not exist at $TABLET_RAW"
            exit 1
          fi

          if [ ! -f "$PHONE_RAW" ]; then
            echo "FATAL: Phone APK file does not exist at $PHONE_RAW"
            exit 1
          fi

          # Copy to cleanly named standalone APKs
          cp "$TABLET_RAW" SolixxBot-Tablet.apk
          cp "$PHONE_RAW" SolixxBot-Phone.apk

          echo "SUCCESS: Both APKs successfully created and verified:"
          ls -lh SolixxBot-Tablet.apk SolixxBot-Phone.apk

      - name: Upload Tablet APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolixxBot-Tablet
          path: SolixxBot-Tablet.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phone APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolixxBot-Phone
          path: SolixxBot-Phone.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APKs to GitHub Releases
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('SolixxBot v1.0.{0} APK (Tablet & Telefon)', github.run_number) }}
          body: |
            ## 🚀 SolixxBot Android APK İndir (Tablet & Telefon)

            Telegram duyuru yönetim, moderasyon ve onay sistemi APK derlemeleri.

            - **Derleme Numarası:** #${{ github.run_number }}
            - **Commit:** `${{ github.sha }}`
            - **Hedef Kanal:** `@SolixxTR`
            - **Platform:** Android 7.0+ (API 24+)
            
            ### Doğrudan İndirme (Assets):
            1. **`SolixxBot-Tablet.apk`** — Tablet ve geniş ekranlara özel gelişmiş navigasyon ve bölünmüş panel arayüzü.
            2. **`SolixxBot-Phone.apk`** — Mobil akıllı telefonlara özel tek elle hızlı onay, fotoğraf düzenleme ve dokunmatik moderasyon arayüzü.
          files: |
            SolixxBot-Tablet.apk
            SolixxBot-Phone.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
